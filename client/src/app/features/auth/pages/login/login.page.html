<div class="min-h-screen flex items-center justify-center p-4 bg-medical-surface">
  <div class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-6 shadow-[0_4px_16px_rgba(0,0,0,0.06)]">
    <h2 class="text-lg font-bold text-slate-900 mb-5">Đăng nhập</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <!-- Email / Phone -->
      <div>
        <label for="email" class="block text-sm font-medium text-slate-900 mb-1.5">
          Email / Số điện thoại
        </label>
        <input id="email" type="text" formControlName="email" placeholder="example@email.com"
          class="w-full min-h-[44px] rounded-xl border border-slate-200 px-3 py-2.5 text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-200 transition" />
        @if (loginForm.get('email')?.touched && loginForm.get('email')?.hasError('required')) {
        <p class="text-xs text-red-500 mt-1">Vui lòng nhập email hoặc số điện thoại.</p>
        }
      </div>

      <!-- Password -->
      <div>
        <div class="flex items-center justify-between mb-1.5">
          <label for="password" class="text-sm font-medium text-slate-900">Mật khẩu</label>
          <button type="button" (click)="navigateTo('forgot-password')"
            class="text-xs text-medical-500 hover:text-medical-600 transition">
            Quên mật khẩu?
          </button>
        </div>

        <div class="relative">
          <input id="password" [type]="showPass() ? 'text' : 'password'" formControlName="password"
            placeholder="••••••••"
            class="w-full min-h-[44px] rounded-xl border border-slate-200 px-3 py-2.5 pr-10 text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-sky-200 transition" />
          <button type="button" (click)="toggleShowPass()"
            class="absolute right-3 top-1/2 -translate-y-1/2 p-1 text-slate-400 hover:text-slate-600"
            aria-label="Hiện/ẩn mật khẩu">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              @if (showPass()) {
              <path
                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
              <line x1="1" y1="1" x2="23" y2="23" />
              } @else {
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
              }
            </svg>
          </button>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" [disabled]="loading() || loginForm.invalid"
        class="w-full min-h-[44px] rounded-xl bg-[var(--color-primary)] font-bold text-sm text-white transition hover:bg-medical-600 disabled:opacity-50 disabled:cursor-not-allowed">
        {{ loading() ? 'Đang đăng nhập...' : 'Đăng nhập' }}
      </button>
    </form>

    <p class="text-center text-xs text-slate-500 mt-4">
      Chưa có tài khoản?
      <button type="button" (click)="navigateTo('register')"
        class="font-semibold text-medical-500 hover:underline ml-1">
        Đăng ký
      </button>
    </p>
  </div>
</div>
