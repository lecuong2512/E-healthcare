# ====================================================================
# E-Healthcare Portal - Nginx Reverse Proxy Configuration
# Requirements: Section 2.1, Section 3.4 & NFR-SEC-01 (HTTPS TLS 1.3)
# ====================================================================

# 1. Redirect all HTTP traffic to HTTPS (Port 80 -> 443)
server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Redirect permanently to HTTPS TLS 1.3
    return 301 https://$host$request_uri;
}

# 2. Secure HTTPS Server Block (TLS 1.3)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name localhost;

    # SSL TLS 1.3 Certificate & Key
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols TLSv1.3;

    # HTTP Security Headers (Medical Portal Security Standard)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Nginx Health Check Endpoint
    location /health {
        default_type text/plain;
        return 200 'OK';
    }

    # API Gateway: Reverse Proxy to NestJS Backend API
    location /api/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Realtime Queue: WebSocket / Socket.io (Section 3.4 & Socket.io v4.7+)
    location /socket.io/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeout
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Frontend SPA: Reverse Proxy to Angular 18 Client
    location / {
        proxy_pass http://client:4200;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
