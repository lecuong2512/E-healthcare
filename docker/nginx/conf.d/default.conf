# ====================================================================
# E-Healthcare Portal - Nginx Reverse Proxy Configuration
# Requirements: 
# - Section 2.1 & Section 3.4: API Gateway & Reverse Proxy
# - NFR-SEC-01: HTTPS TLS 1.3
# - NFR-SEC-03: Rate Limiting 60 requests/minute per public IP
# ====================================================================

# 1. Redirect all HTTP traffic to HTTPS (Port 80 -> 443)
server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Redirect permanently to HTTPS TLS 1.3
    return 301 https://$host$request_uri;
}

# 2. Secure HTTPS Server Block (TLS 1.3 & Rate Limiting)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name localhost;

    # SSL TLS 1.3 Certificate & Key
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols TLSv1.3;

    # HTTP Security Headers (Medical Portal Security Standard)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # NFR-SEC-03: Custom JSON Response for Rate Limit Exceeded (HTTP 429)
    error_page 429 /429.json;
    location = /429.json {
        internal;
        default_type application/json;
        return 429 '{"statusCode": 429, "error": "Too Many Requests", "message": "Vuot qua gioi han tan suat 60 requests/phut tren moi IP cong cong (NFR-SEC-03)"}';
    }

    # Docker Internal DNS Resolver for Dynamic Discovery (allows Nginx to start without server/client)
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $upstream_backend http://server:3000;
    set $upstream_frontend http://client:4200;

    # Nginx Health Check Endpoint (Bypass Rate Limiting for liveness/readiness probes)
    location /health {
        default_type text/plain;
        return 200 'OK';
    }

    # API Gateway: Reverse Proxy to NestJS Backend API with Rate Limiting (60 req/min/IP)
    location /api/ {
        # Enforce Rate Limiting 60 req/min with a burst of 10 requests (nodelay)
        limit_req zone=api_limit burst=10 nodelay;

        proxy_pass $upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Realtime Queue: WebSocket / Socket.io (Section 3.4 & Socket.io v4.7+)
    location /socket.io/ {
        proxy_pass $upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeout
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Frontend SPA: Reverse Proxy to Angular 18 Client
    location / {
        proxy_pass $upstream_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
